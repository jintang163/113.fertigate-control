name: farm-irrigation

services:
  emqx:
    image: emqx/emqx:5.8
    container_name: farm-emqx
    ports:
      - "1883:1883"      # MQTT
      - "18083:18083"    # Dashboard (admin/public)
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: farm-postgres
    environment:
      POSTGRES_DB: farm
      POSTGRES_USER: farm
      POSTGRES_PASSWORD: farm123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farm -d farm"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: farm-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: farm
      DOCKER_INFLUXDB_INIT_PASSWORD: farm12345
      DOCKER_INFLUXDB_INIT_ORG: farm
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: farm-dev-token
    ports:
      - "8086:8086"
    volumes:
      - influxdata:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  decision-service:
    build:
      context: ../decision-service
    container_name: farm-decision
    ports:
      - "8000:8000"
    restart: unless-stopped

  cloud-backend:
    build:
      context: ../cloud-backend
      dockerfile: ../deploy/Dockerfile.backend
    container_name: farm-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MQTT_HOST: tcp://emqx:1883
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: farm
      PG_USER: farm
      PG_PASSWORD: farm123
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: farm-dev-token
      INFLUX_ORG: farm
      INFLUX_BUCKET: telemetry
      DECISION_URL: http://decision-service:8000
    ports:
      - "8080:8080"
    depends_on:
      emqx:
        condition: service_healthy
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      decision-service:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ../web
      dockerfile: ../deploy/Dockerfile.web
    container_name: farm-web
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cloud-backend
    restart: unless-stopped

  # 无硬件演示：--profile simulate 启动，内置田间仿真器向 EMQX 上报并响应阀控
  edge-gateway-sim:
    build:
      context: ../edge-gateway
    container_name: farm-edge-sim
    command: ["python", "-m", "app.main", "-c", "config/gateway.example.yaml", "--simulate"]
    environment:
      MQTT_HOST: emqx
      MQTT_PORT: "1883"
    profiles: ["simulate"]
    depends_on:
      emqx:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  influxdata:
