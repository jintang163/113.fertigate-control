server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API 反代到云端后端
    location /api/ {
        proxy_pass http://cloud-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
